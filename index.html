<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, responsive calculator built from scratch with HTML, CSS and JavaScript." />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <span class="brand">Calculator</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">☾</button>
      </header>

      <div class="display" aria-live="polite" aria-atomic="true">
        <div id="history" class="display__history">&nbsp;</div>
        <div id="result" class="display__result">0</div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key--utility" data-action="clear">AC</button>
        <button class="key key--utility" data-action="delete" aria-label="Delete last character">DEL</button>
        <button class="key key--utility" data-value="%">%</button>
        <button class="key key--operator" data-value="/" aria-label="Divide">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key--operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key--operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key--operator" data-value="+" aria-label="Add">+</button>

        <button class="key key--utility" data-action="sign" aria-label="Toggle positive or negative">±</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key--equals" data-action="equals" aria-label="Calculate result">=</button>
      </div>

      <p class="keyboard-hint">Keyboard supported: 0–9, +, −, ×, ÷, %, Enter, Backspace, Esc</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
